[package]
name = "nanfang_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "nanfang_core"
crate-type = ["cdylib"]

[dependencies]
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
