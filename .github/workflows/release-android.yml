name: Release Android

on:
  push:
    tags:
      - 'v*'

jobs:
  build-aar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: src/go.sum

      - name: Install gomobile
        run: go install golang.org/x/mobile/cmd/gomobile@latest

      - name: Add mobile dependency
        run: |
          go get -tool golang.org/x/mobile/cmd/gobind
          go mod tidy
        working-directory: src

      - name: Initialize gomobile
        run: gomobile init
        working-directory: src

      - name: Build AAR
        run: |
          mkdir -p ${{ github.workspace }}/android
          gomobile bind \
            -v \
            -target=android \
            -androidapi 21 \
            -o ${{ github.workspace }}/android/nanfang.aar \
            -javapkg com.nanfang.vpn \
            ./
        working-directory: src/mobile

      - name: Upload AAR to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" android/nanfang.aar --clobber