name: Release Android APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: src/go.sum

      - name: Install gomobile
        run: go install golang.org/x/mobile/cmd/gomobile@latest

      - name: Add mobile dep
        working-directory: src
        run: |
          go get -tool golang.org/x/mobile/cmd/gobind
          go mod tidy

      - name: Initialize gomobile
        working-directory: src
        run: gomobile init

      - name: Build AAR (Go → Android native lib)
        working-directory: src/mobile
        run: |
          mkdir -p ${{ github.workspace }}/build/aar
          gomobile bind \
            -v \
            -target=android \
            -androidapi 21 \
            -o ${{ github.workspace }}/build/aar/nanfang.aar \
            ./

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          SDK="$ANDROID_HOME"
          BT="$SDK/build-tools/34.0.0"
          AAPT2="$BT/aapt2"
          D8="$BT/d8"
          ZIPALIGN="$BT/zipalign"
          PLAT="$SDK/platforms/android-34/android.jar"
          PROJ="android/app/src/main"
          BUILD="${{ github.workspace }}/build"
          AAR_DIR="$BUILD/aar"

          # Extract classes.jar from AAR
          unzip -o "$AAR_DIR/nanfang.aar" classes.jar -d "$AAR_DIR/extracted"

          # Compile resources via aapt2
          echo "Compiling resources..."
          mkdir -p "$BUILD/obj"
          for f in $(find "$PROJ/res" -type f); do
            "$AAPT2" compile -o "$BUILD/obj/" "$f"
          done

          # Link resources (generates R.java + unsigned APK)
          echo "Linking resources..."
          FLATS=$(ls "$BUILD/obj/"*.flat 2>/dev/null | tr '\n' ' ')
          mkdir -p "$BUILD/gen"
          "$AAPT2" link \
            -o "$BUILD/app.unsigned.apk" \
            -I "$PLAT" \
            --manifest "$PROJ/AndroidManifest.xml" \
            --java "$BUILD/gen" \
            --auto-add-overlay \
            $FLATS

          # Extract classes.jar from AAR
          unzip -o "$AAR_DIR/nanfang.aar" classes.jar -d "$AAR_DIR/extracted"

          # Compile Java sources (including generated R.java)
          echo "Compiling Java..."
          SRC_FILES=$(find "$PROJ/java" -name "*.java")
          GEN_FILES=$(find "$BUILD/gen" -name "*.java" 2>/dev/null)
          mkdir -p "$BUILD/dex"
          javac -encoding UTF-8 \
            -classpath "$PLAT:$AAR_DIR/extracted/classes.jar" \
            -d "$BUILD/dex" \
            $SRC_FILES $GEN_FILES

          # Pack classes into jar and run d8
          echo "Running d8..."
          cd "$BUILD"
          jar cf classes.jar -C dex .
          mkdir -p dex_out
          "$D8" --output dex_out --lib "$PLAT" --min-api 21 classes.jar "$AAR_DIR/nanfang.aar"
          cd "${{ github.workspace }}"

          # Inject classes.dex
          mkdir -p "$BUILD/apk"
          cp "$BUILD/dex_out/classes.dex" "$BUILD/apk/"

          # Extract native libs from AAR
          echo "Extracting native libs..."
          unzip -o "$AAR_DIR/nanfang.aar" "jni/*" -d "$BUILD/aar_extract"
          if [ -d "$BUILD/aar_extract/jni" ]; then
            mkdir -p "$BUILD/apk/lib"
            cp -r "$BUILD/aar_extract/jni/"* "$BUILD/apk/lib/"
          fi

          # Copy official nanocore libs
          echo "Copying official libs..."
          for abi in arm64-v8a armeabi-v7a; do
            if [ -f "android/official-libs/$abi/libnanocore.so" ]; then
              mkdir -p "$BUILD/apk/lib/$abi"
              cp "android/official-libs/$abi/libnanocore.so" "$BUILD/apk/lib/$abi/"
            fi
          done

          # Assemble APK: inject classes.dex and native libs into unsigned APK
          echo "Assembling APK..."
          cp "$BUILD/app.unsigned.apk" "$BUILD/app.apk"
          cd "$BUILD/apk"
          # Add classes.dex
          zip -q "$BUILD/app.apk" classes.dex
          # Add native libs
          find lib -type f 2>/dev/null | while read f; do
            zip -q "$BUILD/app.apk" "$f"
          done
          cd "${{ github.workspace }}"
          echo "APK assembled"

          # Zipalign
          echo "Zipalign..."
          "$ZIPALIGN" -f 4 "$BUILD/app.apk" "$BUILD/app-aligned.apk"

          # Sign with debug key
          echo "Signing..."
          KEYSTORE="$BUILD/debug.keystore"
          keytool -genkey -v -keystore "$KEYSTORE" \
            -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null
          "$BT/apksigner" sign \
            --ks "$KEYSTORE" --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            "$BUILD/app-aligned.apk"

          cp "$BUILD/app-aligned.apk" "${{ github.workspace }}/nanfang-vpn.apk"
          echo "APK: $(ls -lh nanfang-vpn.apk | awk '{print $5}')"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanfang-vpn-android
          path: nanfang-vpn.apk

      - name: Publish APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: nanfang-vpn.apk